<!-- Defines the document as an HTML5 webpage -->
<!DOCTYPE html>
<html lang="en">
<head>
    <!-- Set the character encoding and make the page responsive -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Set the webpage title -->
    <title>Designated Donuts</title>

    <!-- Link the page to its CSS stylesheet -->
    <link rel="stylesheet" href="/static/order.css">

    <!-- Import Remix Icons -->
    <link href="https://cdn.jsdelivr.net/npm/remixicon@4.9.0/fonts/remixicon.css" rel="stylesheet" />
</head>
<body>

    <!-- Navigation bar -->
    <div class="top-navigation-container-bar">
    
        <!-- Display the website logo and name -->
        <div class="left-side-container-box-for-logo">
            <img src="/static/images/Donut_Icon_Logo.png"
                 alt="Donut Destination Icon"
                 height="400px"
                 width="400px">
    
            <span class="logo-title-text">Donut Destination</span>
        </div>
    
    
        <!-- Hamburger button -->
        <button class="toggle-menu" onclick="toggleMenu()">
            <i class="ri-menu-line"></i>
        </button>
    
    
        <!-- Display the navigation options -->
        <div class="right-side-nav-options" id="nav-menu">
    
            <!-- Show Logout if the user is logged in, otherwise show Login -->
            {% if "user_id" in session %}
                <!-- User is logged in -->
                <a class="login-page-action-btn" href="{{ url_for('logout') }}">
                    <i class="ri-user-line"></i>
                    <span class="btn-content-text">Logout</span>
                </a>
            {% else %}
                <!-- User is not logged in -->
                <a class="login-page-action-btn" href="{{ url_for('login_page') }}">
                    <i class="ri-user-line"></i>
                    <span class="btn-content-text">Login</span>
                </a>
            {% endif %}
    
    
            <!-- Link to the home page -->
            <div>
                <a class="home-page-action-btn" href="{{ url_for('home_page') }}">
                    <i class="ri-home-3-line"></i>
                    <span class="btn-content-text">Home</span>
                </a>
            </div>
    
    
            <!-- Link to the About page -->
            <div>
                <a class="about-page-action-btn" href="{{ url_for('about_page') }}">
                    <i class="ri-info-i"></i>
                    <span class="btn-content-text">About</span>
                </a>
            </div>
    
    
            <!-- Link to the Orders page -->
            <div>
                <a class="orders-page-action-btn" href="{{ url_for('order_page') }}">
                    <i class="ri-inbox-archive-line"></i>
                    <span class="btn-content-text">Orders</span>
                </a>
            </div>
    
    
            <!-- Link to the Reviews page -->
            <div>
                <a class="reviews-page-action-btn" href="{{ url_for('review_page') }}">
                    <i class="ri-question-answer-line"></i>
                    <span class="btn-content-text">Reviews</span>
                </a>
            </div>
    
    
            <!-- Link to the shopping cart -->
            <div>
                <a class="cart-page-action-btn" href="{{ url_for('cart_page') }}">
                    <i class="ri-shopping-cart-line"></i>
                </a>
            </div>
    
        </div>
    </div>    
    
    <!-- Load the JavaScript file for the navigation menu -->
    <script src="{{ url_for('static', filename='javascript/toggle.js') }}"></script>


    <!-- Display the available donuts in rows -->
    <div class="total2">

        <!-- Display the first four donuts -->
        <div class="top-row">

            <!-- Display the first donut and its Add button -->
            <div class="black-donut">
                <img src="/static/images/4382.jpg" width="200px" height="200px">
            
                <form action="{{ url_for('add_to_cart') }}" method="POST">
                    <input type="hidden" name="product_id" value="4382">
                    <button type="submit">Add</button>
                </form>
            </div>

            <!-- Display the second donut and its Add button -->
            <div class="blue-donut">
                <img src="/static/images/9873.jpg" width="200px" height="200px">

                <form action="{{ url_for('add_to_cart') }}" method="POST">
                    <input type="hidden" name="product_id" value="9873">
                    <button type="submit">Add</button>
                </form>
            </div>

            <!-- Display the third donut and its Add button -->
            <div class="pink-donut">
                    <img src="/static/images/4536.jpg" width="200px" height="200px">

                    <form action="{{ url_for('add_to_cart') }}" method="POST">
                        <input type="hidden" name="product_id" value="4536">
                        <button type="submit">Add</button>
                    </form>
            </div>

            <!-- Display the fourth donut and its Add button -->
            <div class="green-donut">
                <img src="/static/images/3932.jpg" width="200px" height="200px">

                <form action="{{ url_for('add_to_cart') }}" method="POST">
                    <input type="hidden" name="product_id" value="3932">
                    <button type="submit">Add</button>
                </form>
            </div>
        </div>


        <!-- Display the remaining four donuts -->
        <div class="bottom-row">

            <!-- Display the fifth donut and its Add button -->
            <div class="white-donut">
                <img src="/static/images/1568.jpg" width="200px" height="200px">

                <form action="{{ url_for('add_to_cart') }}" method="POST">
                    <input type="hidden" name="product_id" value="1568">
                    <button type="submit">Add</button>
                </form>
            </div>

            <!-- Display the sixth donut and its Add button -->
            <div class="purple-donut">
                <img src="/static/images/7668.jpg" width="200px" height="200px">

                <form action="{{ url_for('add_to_cart') }}" method="POST">
                    <input type="hidden" name="product_id" value="7668">
                    <button type="submit">Add</button>
                </form>
            </div>

            <!-- Display the seventh donut and its Add button -->
            <div class="yellow-donut">
                <img src="/static/images/8765.jpg" width="200px" height="200px">

                <form action="{{ url_for('add_to_cart') }}" method="POST">
                    <input type="hidden" name="product_id" value="8765">
                    <button type="submit">Add</button>
                </form>
            </div>

            <!-- Display the eighth donut and its Add button -->
            <div class="brown-donut">
                <img src="/static/images/3456.jpg" width="200px" height="200px">

                <form action="{{ url_for('add_to_cart') }}" method="POST">
                    <input type="hidden" name="product_id" value="3456">
                    <button type="submit">Add</button>
                </form>
            </div>
        </div>
    </div>
</body>
</html>
