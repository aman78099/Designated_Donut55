<!-- Defines the document as an HTML webpage -->
<!DOCTYPE html>

<html>
<head>
    <!-- Set the webpage title and link the feedback stylesheet -->
    <title>Designated Donuts</title>
    <link rel="stylesheet" href="/static/feedback.css" id="feedbackForm">
</head>
<body>

<!-- Main feedback form container -->
<div class="total">

    <!-- Submit the review details to the add_review route -->
    <form action="{{ url_for('add_review') }}" method="POST">
        
        <!-- Allow the user to select the review date -->
        <div>
            <label for="review_date">Date:</label>
            <input type="date" id="review_date" name="review_date">
        </div>
    
        <br>
    
        <!-- Allow the user to enter their review -->
        <div>
            <label for="review">Review:</label>
            <textarea name="review_text" rows="5" cols="43" required></textarea>
        </div>
    
        <br>
    
        <!-- Allow the user to enter a rating from 1 to 5 -->
        <div>
            <label for="rating">Rating:</label>
            <input type="number" name="rating" min="1" max="5" required>
        </div>
    
        <br>
    
        <!-- Provide buttons to submit the review or leave the page -->
        <div class="buttons">
    
            <div>
                <button type="submit" id="Submit">Submit</button>
            </div>
            
            <br>
    
            <div>
                <button
                    type="button"
                    class="leave"onclick="window.location.href='{{ url_for('review_page') }}'">Leave</button>
                </button>
            </div>
        </div>
    </form>

<!-- Load the JavaScript file for the feedback form -->
<script src="/static/javascript/feedback.js"></script>
</body>
</html>
